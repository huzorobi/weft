[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weft"
version = "0.1.0"
description = "Free-source OSINT reconnaissance aggregator — weaves open sources into one entity graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "HuzoSecurity Ltd" }]

dependencies = [
    "phonenumbers>=8.13",
    "dnspython>=2.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "neo4j>=5.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "socksio>=1.0",   # SOCKS proxy support for httpx (dark-web over Tor)
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "pyvis>=0.3.2"]
report = ["markdown>=3.5", "weasyprint>=60"]
modules = ["holehe", "maigret", "sherlock-project", "theHarvester"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
weft = "weft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
