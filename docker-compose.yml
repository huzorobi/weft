# Weft local stack: app + Neo4j + Postgres + SearXNG. All free, all self-hosted.
services:
  app:
    build: .
    env_file: .env
    depends_on:
      - neo4j
      - postgres
      - searxng
    ports:
      - "8000:8000"   # FastAPI
    volumes:
      - ./:/app
    command: uvicorn weft.api.main:app --host 0.0.0.0 --port 8000

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change_me
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng

volumes:
  neo4j_data:
  postgres_data:
